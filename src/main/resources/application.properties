# =============================================================================
# AI Developer Assistant - Application Configuration
#
# Every property can be overridden via an environment variable.
# Spring Boot maps environment variables to properties using relaxed binding:
#   LLM_OPENAI_API_KEY          -> llm.openai.api-key
#   LLM_OPENAI_MODEL            -> llm.openai.model
#   LLM_OPENAI_MAX_TOKENS       -> llm.openai.max-tokens
#   LLM_OPENAI_TIMEOUT_SECONDS  -> llm.openai.timeout-seconds
#   LLM_OPENAI_SERVICE_TIMEOUT_SECONDS -> llm.openai.service-timeout-seconds
#   LLM_OPENAI_MAX_PROMPT_CHARS -> llm.openai.max-prompt-chars
#   LOGGING_LEVEL_ROOT          -> logging.level.root
#   LOGGING_LEVEL_COM_AIDEVASSISTANT -> logging.level.com.aidevassistant
# =============================================================================

# -----------------------------------------------------------------------------
# LLM / OpenAI Configuration
# -----------------------------------------------------------------------------

# Required: API key for the OpenAI provider.
# No default — the application will fail to start if this is blank.
# Override: LLM_OPENAI_API_KEY
llm.openai.api-key=${LLM_OPENAI_API_KEY:}

# LLM model to use for chat completions.
# Override: LLM_OPENAI_MODEL
llm.openai.model=${LLM_OPENAI_MODEL:gpt-4o}

# Maximum tokens the LLM may return per response.
# Override: LLM_OPENAI_MAX_TOKENS
llm.openai.max-tokens=${LLM_OPENAI_MAX_TOKENS:1024}

# HTTP client timeout in seconds for a single OpenAI API call.
# Override: LLM_OPENAI_TIMEOUT_SECONDS
llm.openai.timeout-seconds=${LLM_OPENAI_TIMEOUT_SECONDS:30}

# Service-level deadline in seconds for the full analysis pipeline including one retry.
# Must be greater than timeout-seconds * 2 to cover one retry.
# Override: LLM_OPENAI_SERVICE_TIMEOUT_SECONDS
llm.openai.service-timeout-seconds=${LLM_OPENAI_SERVICE_TIMEOUT_SECONDS:70}

# Maximum allowed prompt length in characters.
# Requests exceeding this limit are rejected with HTTP 400 before any LLM call is made.
# ~12,000 chars ≈ ~3,000 tokens — well within GPT-4o's context window.
# Override: LLM_OPENAI_MAX_PROMPT_CHARS
llm.openai.max-prompt-chars=${LLM_OPENAI_MAX_PROMPT_CHARS:12000}

# OpenAI Chat Completions API path (relative to base URL https://api.openai.com).
# Override only if using a proxy or a different API version.
# Override: LLM_OPENAI_CHAT_PATH
llm.openai.chat-path=${LLM_OPENAI_CHAT_PATH:/v1/chat/completions}

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------

# Console log pattern: timestamp (local timezone), thread, requestId (MDC), PID, level, logger, message.
# %d{...} with no explicit timezone uses the JVM default (local) timezone.
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{requestId:-unknown}] [${PID:-}] %level::%logger{0} %msg%n

# Root log level. Override: LOGGING_LEVEL_ROOT
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}

# Application log level. Set to DEBUG to see sanitized prompts and truncated LLM responses.
# Override: LOGGING_LEVEL_COM_AIDEVASSISTANT
logging.level.com.aidevassistant=${LOGGING_LEVEL_COM_AIDEVASSISTANT:INFO}

# -----------------------------------------------------------------------------
# Actuator & Metrics (Micrometer + Prometheus)
# -----------------------------------------------------------------------------

# Expose health, info, and prometheus scrape endpoints over HTTP.
# Override: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,prometheus,metrics}

# Show full health details (useful for liveness/readiness probes).
# Override: MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS
management.endpoint.health.show-details=${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:always}

# Add common tags applied to every metric (useful for multi-instance deployments).
# Override: MANAGEMENT_METRICS_TAGS_APPLICATION
management.metrics.tags.application=${MANAGEMENT_METRICS_TAGS_APPLICATION:ai-dev-assistant}

# Histogram buckets for latency percentiles (p50, p95, p99).
management.metrics.distribution.percentiles-histogram.llm.analysis.latency=true
management.metrics.distribution.percentiles.llm.analysis.latency=0.5,0.95,0.99

# -----------------------------------------------------------------------------
# Server performance tuning
# -----------------------------------------------------------------------------

# Enable HTTP response compression (saves bandwidth on JSON responses).
# Override: SERVER_COMPRESSION_ENABLED
server.compression.enabled=${SERVER_COMPRESSION_ENABLED:true}
server.compression.mime-types=application/json
server.compression.min-response-size=1024

# Tomcat connection timeout — how long to wait for a client to send a request
# after the TCP connection is established. Default is 60s which is too long.
# Override: SERVER_TOMCAT_CONNECTION_TIMEOUT
server.tomcat.connection-timeout=${SERVER_TOMCAT_CONNECTION_TIMEOUT:10s}

# Keep-alive timeout — how long to keep an idle HTTP connection open.
# Override: SERVER_TOMCAT_KEEP_ALIVE_TIMEOUT
server.tomcat.keep-alive-timeout=${SERVER_TOMCAT_KEEP_ALIVE_TIMEOUT:30s}

# Maximum number of threads for request processing.
# Override: SERVER_TOMCAT_THREADS_MAX
server.tomcat.threads.max=${SERVER_TOMCAT_THREADS_MAX:50}

# Minimum number of threads kept alive (avoids cold-start latency on burst traffic).
# Override: SERVER_TOMCAT_THREADS_MIN_SPARE
server.tomcat.threads.min-spare=${SERVER_TOMCAT_THREADS_MIN_SPARE:5}

# -----------------------------------------------------------------------------
# Jackson performance tuning
# -----------------------------------------------------------------------------

# Do not fail on unknown properties in request bodies — forward-compatible with
# future API additions without breaking existing clients.
spring.jackson.deserialization.fail-on-unknown-properties=false

# Do not serialize null values — keeps response payloads smaller.
spring.jackson.default-property-inclusion=non_null

# -----------------------------------------------------------------------------
# Circuit Breaker (Resilience4j — llm-openai)
# -----------------------------------------------------------------------------

# Expose circuit breaker health in /actuator/health
management.health.circuitbreakers.enabled=true

# Expose circuit breaker state in /actuator/circuitbreakers
management.endpoint.circuitbreakers.enabled=true

# -----------------------------------------------------------------------------
# Rate Limiting (Bucket4j — global token bucket)
# -----------------------------------------------------------------------------

# Enable or disable rate limiting entirely.
# Override: RATE_LIMIT_ENABLED
rate-limit.enabled=${RATE_LIMIT_ENABLED:true}

# Steady-state refill rate — tokens added to the bucket per second.
# Override: RATE_LIMIT_REQUESTS_PER_SECOND
rate-limit.requests-per-second=${RATE_LIMIT_REQUESTS_PER_SECOND:10}

# Burst capacity — maximum tokens that can accumulate, allowing short bursts.
# Must be >= requests-per-second. Typical: 2x the steady-state rate.
# Override: RATE_LIMIT_BURST_CAPACITY
rate-limit.burst-capacity=${RATE_LIMIT_BURST_CAPACITY:20}
